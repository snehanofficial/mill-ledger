name: MillLedger CI

on:
  push:
    branches: [main, "remediation/*", "remediation/**"]
  pull_request:
    branches: [main, "remediation/*", "remediation/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Benchmark
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mill_ledger
          POSTGRES_USER: mill
          POSTGRES_PASSWORD: mill_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://mill:mill_password@localhost:5432/mill_ledger
      BETTER_AUTH_SECRET: test_production_super_secret_key_minimum_32_characters_long_ci
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:5173,http://localhost:4173

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @mill-ledger/server exec prisma generate

      - name: Run linter
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run Prisma migrations deploy
        run: pnpm --filter @mill-ledger/server exec prisma migrate deploy

      - name: Seed database with benchmark fixtures
        run: pnpm --filter @mill-ledger/server db:seed

      - name: Run Vitest unit & integration test suites
        run: pnpm test

      - name: Execute benchmark verification script
        run: pnpm benchmark

      - name: Run dependency vulnerability audit
        run: pnpm audit --audit-level=critical

      - name: Build all packages (server, client, shared)
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm test:e2e

      - name: Validate Remediation Tracker
        run: node audit/tracker/check-tracker.mjs
