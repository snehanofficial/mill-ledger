<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Murukku Food Packaging">
  <defs>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>
  <!-- Pouch Body -->
  <rect x="25" y="25" width="110" height="115" rx="14" fill="url(#pouchGrad)" stroke="#b45309" stroke-width="2.5" />
  <!-- Seal top -->
  <path d="M25 40 L135 40" stroke="#92400e" stroke-width="3" stroke-dasharray="4,2" />
  <!-- Top brand band -->
  <rect x="25" y="25" width="110" height="15" rx="6" fill="url(#headerGrad)" />
  <!-- Spiral Murukku Emblem -->
  <circle cx="80" cy="85" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <path d="M80 62 A23 23 0 0 1 103 85 A23 23 0 0 1 80 108 A23 23 0 0 1 57 85 A17 17 0 0 1 80 68 A17 17 0 0 1 97 85 A17 17 0 0 1 80 102 A11 11 0 0 1 69 85 A11 11 0 0 1 80 74 A6 6 0 0 1 86 85" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" />
  <!-- Weight badge -->
  <rect x="52" y="122" width="56" height="14" rx="7" fill="#176b54" />
  <text x="80" y="132" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">200g Pkt</text>
</svg>
