<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-hydration language synchronization to prevent FOUC and TTS pronunciation distortion (WCAG 3.1.1 / F-086) -->
    <script>
      (function () {
        try {
          var activeUser = localStorage.getItem("mill_ledger_active_user");
          var userKey = activeUser ? "mill_ledger_lang_" + activeUser : null;
          var lang =
            (userKey && localStorage.getItem(userKey)) ||
            localStorage.getItem("mill_ledger_lang");
          if (lang === "ta" || lang === "en") {
            document.documentElement.lang = lang;
          }
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#176b54" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="MillLedger is an order-to-audit ERP and shop floor ledger for small food manufacturing mills in India."
    />
    <link rel="canonical" href="%VITE_APP_URL%/" />

    <!-- Open Graph Protocol (ogp.me) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MillLedger" />
    <meta
      property="og:title"
      content="MillLedger | Order-to-Audit ERP for Small Food Manufacturing Mills"
    />
    <meta
      property="og:description"
      content="Order-to-audit ERP for food mills: atomic stock ledger, BOM production variance tracking, offline salesman order capture, ATP reservations, and Indian GST invoicing."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MillLedger ERP Platform Preview" />

    <!-- Twitter Card Markup -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MillLedger | Order-to-Audit ERP for Small Food Manufacturing Mills"
    />
    <meta
      name="twitter:description"
      content="Order-to-audit ERP for food mills: atomic stock ledger, BOM production variance tracking, offline salesman order capture, ATP reservations, and Indian GST invoicing."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og-preview.png" />
    <meta name="twitter:image:alt" content="MillLedger ERP Platform Preview" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script id="millledger-route-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MillLedger",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web browser (Progressive Web App)",
        "description": "Order-to-audit ERP and shop floor ledger software for small food manufacturing mills in India.",
        "publisher": {
          "@type": "Organization",
          "name": "MillLedger",
          "url": "%VITE_APP_URL%/"
        }
      }
    </script>

    <title>
      MillLedger | Order-to-Audit ERP for Small Food Manufacturing Mills
    </title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
